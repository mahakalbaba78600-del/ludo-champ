name: Build Ludo Champ APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Setup Android Project Files
        run: |
          mkdir -p /tmp/backup
          cp pubspec.yaml /tmp/backup/
          cp -r lib /tmp/backup/
          flutter create --platforms=android --org com.ludochamp.app --project-name ludo_champ .
          cp /tmp/backup/pubspec.yaml .
          cp -r /tmp/backup/lib .
          flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ludo-Champ-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
